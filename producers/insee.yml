# ── geo.api.gouv.fr — every commune's name, population and surface ──────────
- name: frCommuneGeoAll
  kind: remote
  operation: frCommunes
  records: $[*]
  keyTemplate: '{key}'
  echoKeyAs: key
  maxKeysPerCall: 1
  args: {fields: 'code,nom,population,surface,codeDepartement'}
  project: {code: code, name: nom, departement: codeDepartement, population: population, surfaceHa: surface}
  cache: {kind: ttl, seconds: 604800}
