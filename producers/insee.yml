# ── INSEE Melodi ─────────────────────────────────────────────────────────────
# Per place: GEO is the place's melodiGeo ('2025-COM-80021' / '2025-ARM-75118'),
# one call per place. Nationally: GEO=COM returns every commune in ONE call
# (~35k observations, 30-70 s cold), so national producers cache a week — a
# demo must never pay a cold national fetch twice. Melodi echoes GEO with the
# CURRENT vintage ('2026-COM-80021'); `code` is parsed from it, and `id` is
# minted from the row's own dimensions so place and national doors converge.
- name: frIncomeAtPlace
  kind: remote
  operation: frFilosofi
  records: $.observations[*]
  keyArg: GEO
  echoKeyAs: key
  maxKeysPerCall: 1
  args: {}
  project: {geo: dimensions.GEO, measure: dimensions.FILOSOFI_MEASURE, value: measures.OBS_VALUE_NIVEAU.value, year: dimensions.TIME_PERIOD}
  compute: {code: 'split(r.geo, ''-'')[2]', id: 'r.geo + '':'' + r.measure'}
  cache: {kind: ttl, seconds: 604800, negativeTtlSeconds: 3600}
- name: frMedianIncomeAll
  kind: remote
  operation: frFilosofi
  records: $.observations[*]
  keyTemplate: '{key}'
  echoKeyAs: key
  maxKeysPerCall: 1
