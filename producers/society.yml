# ── Work and qualifications (INSEE census 2023, Melodi) ──────────────────────
# Same shape as insee.yml: one call per place, or one call for every commune
# (~35k observations, 5-10 s cold) cached a week. Census unemployment is
# SELF-DECLARED (ILO-style questions in the census form), so it runs higher than
# France Travail registrations or the ILO survey rate — compare like with like.
- name: frActivityAtPlace
  kind: remote
  operation: frActivity
  records: $.observations[*]
  keyArg: GEO
  echoKeyAs: key
  maxKeysPerCall: 1
  args: {SEX: _T, AGE: Y_GE15}
  project: {geo: dimensions.GEO, status: dimensions.EMPSTA_ENQ, persons: measures.OBS_VALUE_NIVEAU.value, year: dimensions.TIME_PERIOD}
  compute: {code: 'split(r.geo, ''-'')[2]', id: 'r.geo + '':'' + r.status'}
  cache: {kind: ttl, seconds: 604800, negativeTtlSeconds: 3600}
- name: frUnemployedAll
  kind: remote
  operation: frActivity
  records: $.observations[*]
  keyTemplate: '{key}'
  echoKeyAs: key
  maxKeysPerCall: 1
  args: {GEO: COM, SEX: _T, AGE: Y_GE15, EMPSTA_ENQ: '2', maxResult: '60000'}
  project: {geo: dimensions.GEO, status: dimensions.EMPSTA_ENQ, persons: measures.OBS_VALUE_NIVEAU.value, year: dimensions.TIME_PERIOD}
  compute: {code: 'split(r.geo, ''-'')[2]', id: 'r.geo + '':'' + r.status'}
  cache: {kind: ttl, seconds: 604800}
- name: frLabourForceAll
  kind: remote
  operation: frActivity
  records: $.observations[*]
  keyTemplate: '{key}'
  echoKeyAs: key
  maxKeysPerCall: 1
  args: {GEO: COM, SEX: _T, AGE: Y_GE15, EMPSTA_ENQ: 1T2, maxResult: '60000'}
  project: {geo: dimensions.GEO, status: dimensions.EMPSTA_ENQ, persons: measures.OBS_VALUE_NIVEAU.value, year: dimensions.TIME_PERIOD}
  compute: {code: 'split(r.geo, ''-'')[2]', id: 'r.geo + '':'' + r.status'}
  cache: {kind: ttl, seconds: 604800}

- name: frDiplomasAtPlace
  kind: remote
