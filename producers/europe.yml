# Region names (NUTS 2024) from Eurostat GISCO — one 90 KB file.
- name: euRegionNames
  kind: tabular
  url: "https://gisco-services.ec.europa.eu/distribution/v2/nuts/csv/NUTS_AT_2024.csv"
  format: csv
  keyColumn: NUTS_ID
  keyMatch: exact
  maxRows: 5000
  maxRowsPerKey: 2
  project: {code: NUTS_ID, name: NUTS_NAME, latinName: NAME_LATN}
  # The file starts with a byte-order mark glued to CNTR_CODE, so the country is
  # taken from the code instead (a NUTS code's first two letters ARE the country).
  compute: {country: 'substring(r.code, 0, 2)', id: 'r.code'}
  fileCacheSeconds: 2592000
  cache: {kind: ttl, seconds: 2592000}
