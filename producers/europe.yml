# ── Eurostat regional statistics — France against its neighbours ────────────
# Each indicator is ONE comma-separated SDMX-CSV file from Eurostat's
# dissemination API covering EVERY European NUTS region since 2012 (0.3-1.7 MB,
# keyless), downloaded once and cached a week, then read by region code. Same
# definitions on both sides of a border — the point of using Eurostat rather
# than INSEE beside Destatis: a French departement is NUTS 3 (Bas-Rhin =
# FRF11), a German Kreis is NUTS 3 (Ortenaukreis = DE134), a Swiss canton is
# NUTS 3 (Basel-Stadt = CH031). Labour-market, life-expectancy and income
# series exist only at NUTS 2 (the first four characters: FRF1 Alsace, DE13
# Freiburg). 'p' in flag = provisional, 'e' estimated, 'b' break in series.

- name: euGdpPps
  kind: tabular
  # GDP per inhabitant in purchasing power standards (PPS, EU27=common currency of purchasing power), NUTS 3.
  url: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/nama_10r_3gdp/A.PPS_EU27_2020_HAB.?format=SDMX-CSV&startPeriod=2012"
  format: csv
  keyColumn: geo
  keyMatch: exact
  maxRows: 60000
  maxRowsPerKey: 20
  project: {geo: geo, year: TIME_PERIOD, value: OBS_VALUE, flag: OBS_FLAG, dataset: DATAFLOW, unit: unit}
  # Identity is the indicator, region and year — never the row number, which
  # would collide across the nine files that all feed EuRegionStat.
  compute: {indicator: "'gdpPps'", id: "'gdpPps:' + r.geo + ':' + r.year"}
  fileCacheSeconds: 604800
  cache: {kind: ttl, seconds: 604800}

