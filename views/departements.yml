         max(CASE WHEN r.k = 'immi_T' THEN r.v END) AS residents,
         max(CASE WHEN r.k = 'popY15T24' THEN r.v END) AS young,
         max(CASE WHEN r.k = 'pop_T' THEN r.v END) AS pop,
         max(CASE WHEN r.k = 'name' THEN r.s END) AS departement
