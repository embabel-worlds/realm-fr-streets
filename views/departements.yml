         100.0 * young / pop AS youngAdults, 100.0 * immi / residents AS immigrants, pop
    WHERE crime IS NOT NULL AND income IS NOT NULL AND poverty IS NOT NULL AND gini IS NOT NULL
      AND density IS NOT NULL AND youngAdults IS NOT NULL AND immigrants IS NOT NULL
    RETURN correlate(income, crime) AS incomeVsCrime,
           correlate(poverty, crime) AS povertyVsCrime,
           correlate(gini, crime) AS inequalityVsCrime,
           correlate(log(density), crime) AS densityVsCrime,
           correlate(youngAdults, crime) AS youngAdultsVsCrime,
           correlate(immigrants, crime) AS immigrantsVsCrime,
           count(*) AS departements

# Predictors come back as x1..xn in this FIXED order, switched-off ones dropped:
# income, poverty, inequality, density (log), youngAdults, immigrants.
- name: FrDepartementModel
  description: "What best predicts a departement's recorded-crime rate — a least-squares fit across EVERY departement (no suppression, so no small-commune bias) on whichever predictors are switched on: median standard of living, poverty rate, INEQUALITY (Gini — published for departements only), log density, the 15-24 share and the IMMIGRANT share. Standardized betas, R², and the departements furthest above and below prediction by name. Predictors return as x1..xn in the fixed order income, poverty, inequality, density, youngAdults, immigrants, switched-off ones dropped. For violent theft, drug trafficking, physical violence and attempted homicide (2025) inequality carries the largest beta and the immigrant share's solo correlation mostly does not survive beside it. Association across departements, never causation and never a statement about any person or group. With ~96 departements and predictors this correlated (income, poverty and inequality move together), individual betas carry wide uncertainty — read the pattern, not the second decimal. Recorded crime also measures reporting and police activity."
  params:
    indicator: { type: string, default: "Vols violents sans arme", description: "SSMSI indicator label, verbatim — the 15 commune labels plus 'Homicides', 'Tentatives d'homicide' and 'Usage de stupéfiants (hors AFD)'." }
    year: { type: int, default: 2025, description: "2016-2025." }
    income: { type: boolean, default: true, description: "Include median standard of living." }
    poverty: { type: boolean, default: true, description: "Include poverty rate." }
    inequality: { type: boolean, default: true, description: "Include the Gini index of standard of living." }
    density: { type: boolean, default: true, description: "Include log population density." }
    youngAdults: { type: boolean, default: true, description: "Include the share aged 15-24." }
    immigrants: { type: boolean, default: true, description: "Include the immigrant share (an area measure, never a statement about immigrants)." }
  cypher: |
    MATCH (u:FrCommunes {set:'france'})-[:HAS_GEO]->(g:FrCommuneGeo)
    WITH g.departement AS dep, sum(toFloat(g.surfaceHa)) / 100.0 AS km2, sum(toFloat(g.population)) AS gpop
    WITH collect({code: dep, k: 'density', v: gpop / km2}) AS a
    WITH a, CASE $indicator
      WHEN 'Cambriolages de logement' THEN 'Cambriolages'
      WHEN 'Violences physiques intrafamiliales' THEN 'intrafamiliales'
      WHEN 'Violences physiques hors cadre familial' THEN 'hors'
      WHEN 'Violences sexuelles' THEN 'sexuelles'
      WHEN 'Vols avec armes' THEN 'armes'
      WHEN 'Vols violents sans arme' THEN 'violents'
      WHEN 'Vols sans violence contre des personnes' THEN 'personnes'
      WHEN 'Vols de véhicule' THEN 'véhicule'
      WHEN 'Vols dans les véhicules' THEN 'dans'
      WHEN "Vols d'accessoires sur véhicules" THEN 'accessoires'
      WHEN 'Destructions et dégradations volontaires' THEN 'Destructions'
      WHEN 'Usage de stupéfiants' THEN 'Usage'
      WHEN 'Usage de stupéfiants (AFD)' THEN 'AFD'
      WHEN 'Usage de stupéfiants (hors AFD)' THEN 'Usage'
      WHEN 'Trafic de stupéfiants' THEN 'Trafic'
      WHEN 'Escroqueries et fraudes aux moyens de paiement' THEN 'Escroqueries'
      WHEN 'Homicides' THEN 'Homicides'
      WHEN "Tentatives d'homicide" THEN 'Tentatives'
    END AS token
    MATCH (s:FrDeptCrimeSlice {slice: token})-[:LISTS_DEPT_CRIME]->(c:FrDeptCrime)
    WITH a, c, c.indicator AS lbl, c.year AS yr WHERE lbl = $indicator AND yr = $year
    WITH a, collect({code: c.departement, k: 'crime', v: toFloat(c.ratePer1000)}) AS b1,
         collect({code: c.departement, k: 'count', v: toFloat(c.count)}) AS b2
    WITH a + b1 + b2 AS a
    MATCH (d:FrDepartements {set:'france'})-[:HAS_DEPT_INCOME]->(i:FrDeptIncome)
    WITH d, a, i, i.measure AS m WHERE m IN ['MED_SL', 'PR_MD60', 'GI_SL', 'IR_D9_D1_SL']
    WITH d, a, collect({code: i.code, k: m, v: toFloat(i.value)}) AS b
    WITH d, a + b AS a
    MATCH (d)-[:HAS_DEPT_IMMIGRATION]->(im:FrDeptImmigration)
    WITH d, a, collect({code: im.code, k: 'immi' + im.status, v: toFloat(im.persons)}) AS b
    WITH d, a + b AS a
    MATCH (d)-[:HAS_DEPT_POPULATION]->(p:FrDeptPopulation)
    WITH d, a, p, p.ageBand AS band WHERE band IN ['_T', 'Y15T24']
    WITH d, a, collect({code: p.code, k: 'pop' + band, v: toFloat(p.persons)}) AS b
    WITH d, a + b AS a
    MATCH (d)-[:HAS_DEPT_NAME]->(n:FrDepartement)
    WITH a, collect({code: n.code, k: 'name', s: n.name}) AS b
    WITH a + b AS a
    UNWIND a AS r
    WITH r.code AS dep,
         max(CASE WHEN r.k = 'crime' THEN r.v END) AS crime,
         max(CASE WHEN r.k = 'count' THEN r.v END) AS count,
         max(CASE WHEN r.k = 'MED_SL' THEN r.v END) AS income,
         max(CASE WHEN r.k = 'PR_MD60' THEN r.v END) AS poverty,
         max(CASE WHEN r.k = 'GI_SL' THEN r.v END) AS gini,
         max(CASE WHEN r.k = 'IR_D9_D1_SL' THEN r.v END) AS d9d1,
         max(CASE WHEN r.k = 'density' THEN r.v END) AS density,
         max(CASE WHEN r.k = 'immi1' THEN r.v END) AS immi,
         max(CASE WHEN r.k = 'immi_T' THEN r.v END) AS residents,
         max(CASE WHEN r.k = 'popY15T24' THEN r.v END) AS young,
         max(CASE WHEN r.k = 'pop_T' THEN r.v END) AS pop,
         max(CASE WHEN r.k = 'name' THEN r.s END) AS departement
    WITH dep, departement, crime, count, income, poverty, gini, d9d1, density,
         100.0 * young / pop AS youngAdults, 100.0 * immi / residents AS immigrants, pop
    WHERE crime IS NOT NULL AND income IS NOT NULL AND poverty IS NOT NULL AND gini IS NOT NULL
      AND density IS NOT NULL AND youngAdults IS NOT NULL AND immigrants IS NOT NULL
    WITH departement + ' (' + dep + ')' AS label, crime, [x IN [
           CASE WHEN $income      THEN income END,
           CASE WHEN $poverty     THEN poverty END,
           CASE WHEN $inequality  THEN gini END,
           CASE WHEN $density     THEN log(density) END,
           CASE WHEN $youngAdults THEN youngAdults END,
           CASE WHEN $immigrants  THEN immigrants END
         ] WHERE x IS NOT NULL] AS predictors
    RETURN regress(predictors, crime, label) AS model, count(*) AS departements
