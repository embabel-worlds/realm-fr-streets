  cypher: |
    MATCH (u:FrCommunes {set:'france'})-[:HAS_GEO]->(g:FrCommuneGeo)
    WITH g.departement AS dep, sum(toFloat(g.surfaceHa)) / 100.0 AS km2, sum(toFloat(g.population)) AS gpop
    WITH collect({code: dep, k: 'density', v: gpop / km2}) AS a
    WITH a, CASE $indicator
      WHEN 'Cambriolages de logement' THEN 'Cambriolages'
      WHEN 'Violences physiques intrafamiliales' THEN 'intrafamiliales'
      WHEN 'Violences physiques hors cadre familial' THEN 'hors'
      WHEN 'Violences sexuelles' THEN 'sexuelles'
      WHEN 'Vols avec armes' THEN 'armes'
      WHEN 'Vols violents sans arme' THEN 'violents'
      WHEN 'Vols sans violence contre des personnes' THEN 'personnes'
