name: fr-streets
description: |
  France, joined at a commune — keyless official sources queryable as ONE
  graph, keyed on the INSEE code (never the postal code, which is
  many-to-many with communes):
  police- and gendarmerie-recorded crime for every commune 2016-2025 (SSMSI,
  15 indicators) and every departement (homicides included, nothing
  suppressed); median standard of living, poverty and INEQUALITY (INSEE
  Filosofi 2023); immigrant share, age structure and population (census
  2012-2023); density; property prices per m2 for flats and houses in every
  commune (Etalab DVF statistics); the mayor (after the March 2026
  municipales) and the departement's deputies.

  Ask about ANY commune — (:FrCommune {code}), (:FrMelodiPlace {geo}),
  (:FrDeptRef {code}) — or the places you watch (:FrPlace). National
  cross-sections hang off (:FrCrimeSlice), (:FrDeptCrimeSlice),
  (:FrCommunes {set:'france'}), (:FrDepartements {set:'france'}) and
  (:FrHousingScale), so places can be ranked, trended and modelled across
  France.

  Views — places: FrPlaceDossier, FrCrimeAtMyPlaces, FrCrimeTrendAtPlace,
  FrDeputiesAtMyPlaces; any commune: FrCommuneSnapshot, FrCommuneCrime,
  FrCommuneContext; housing: FrHousingAffordability, FrDeptHousing; crime:
  FrNationalTrend, FrDepartementLeague, FrCrimeLeague, FrCrimeMovers; models:
  FrDepartementModel, FrDepartementPredictorsOneByOne, FrDepartementRows,
  FrWhatBestPredictsCrime, FrCrimePredictorsOneByOne, FrCommunesRanked,
  FrModelRows.

  Honest limits, carried into every view: France publishes NO geolocated crime
  and nothing below the commune (bar Paris/Lyon/Marseille arrondissements); a
  commune's crime is published only after >5 facts in each of 3 consecutive
  years; France collects no ethnic statistics, so "immigre" (born abroad, not
  French at birth) is the closest published measure; DVF excludes
  Alsace-Moselle and Mayotte. Models describe places, never people.

  No API keys and no accounts - the realm works the moment it is installed.
